services:
  app:
    build:
      context: .
      target: production
    restart: always
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - laravel

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - ${FORWARD_DB_PORT}:3306
    networks:
      - laravel

  nginx:
    image: nginx:stable
    ports:
      - ${FORWARD_NGINX_PORT}:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html
    depends_on:
      - app
    networks:
      - laravel

  mailtip:
    image: axllent/mailpit
    ports:
      - ${MAIL_PORT}:1025
      - ${MAIL_PIT_PORT}:8025
    networks:
      - laravel

volumes:
  dbdata:

networks:
  laravel:
